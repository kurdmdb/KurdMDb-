<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KurdMDb - لەژێر چاکسازییە</title>
    <!-- Google Font: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Reset absolute defaults */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #000000;
        }

        body {
            color: #ffffff;
            display: grid;
            place-items: center; /* Center horizontally and vertically perfectly */
            padding: 16px;
            position: relative;
        }

        /* Ambient Glowing Background Effect */
        .glow-top {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            top: 5%;
            left: 5%;
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            animation: pulse 6s infinite alternate;
        }

        .glow-bottom {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 5%;
            right: 5%;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            animation: pulse 8s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Card Container */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 480px; /* Fits all screens easily */
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                        0 0 30px rgba(168, 85, 247, 0.2);
            margin: auto;
        }

        /* Icon Box */
        .icon-box {
            width: 75px;
            height: 75px;
            margin: 0 auto 24px auto;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Heading */
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 30%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Description */
        p.description {
            font-size: 1rem;
            color: #a1a1aa;
            line-height: 1.7;
            margin-bottom: 20px;
            word-break: break-word;
        }

        /* Highlight Box */
        p.subtext {
            font-size: 0.9rem;
            color: #c084fc;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 10px 16px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
            max-width: 100%;
        }

        /* Divider Line */
        .divider {
            height: 1px;
            width: 80%;
            margin: 0 auto 20px auto;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.4), transparent);
        }

        /* Footer Text */
        .footer-text {
            font-size: 0.95rem;
            color: #f4f4f5;
            font-weight: 600;
        }

        /* Extra Responsive fix for very small screens (iPhone SE, etc) */
        @media (max-width: 360px) {
            .card {
                padding: 28px 16px;
            }
            h1 {
                font-size: 1.25rem;
            }
            .icon-box {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Purple Lights -->
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <!-- Main Card -->
    <div class="card">
        <div class="icon-box">🔧</div>
        
        <h1>KurdMDb لەژێر چاکسازییە</h1>
        
        <p class="description">
            ئێستا لەسەر باشترکردنی سیستەم، خێرایی و پاراستنی ماڵپەڕەکە کار دەکرێت.
        </p>

        <p class="subtext">
            تکایە دواتر سەردانی ماڵپەڕەکە بکەن.
        </p>

        <div class="divider"></div>

        <p class="footer-text">
            سوپاس بۆ پشتگیریتان ❤️
        </p>
    </div>

</body>
</html>
