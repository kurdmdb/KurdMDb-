name: KurdMDb - چاودێری سەلامەتی

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  health-monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: کۆکردنەوەی کۆد
        uses: actions/checkout@v5

      - name: دامەزراندنی Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: دامەزراندنی پەیوەندییەکان
        run: npm install axios @supabase/supabase-js

      - name: جێبەجێکردنی چاودێری
        run: node scripts/health_report.js
        env:
          SECURITY_TELEGRAM_BOT_TOKEN: ${{ secrets.SECURITY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEBSITE_URL: "https://kurdmdb.vercel.app/"
