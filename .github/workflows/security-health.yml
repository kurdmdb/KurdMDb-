import axios from 'axios';
import { createClient } from '@supabase/supabase-js';

const {
  SECURITY_TELEGRAM_BOT_TOKEN,
  TELEGRAM_CHAT_ID,
  SUPABASE_URL,
  SUPABASE_SERVICE_KEY,
  WEBSITE_URL = 'https://kurdmdb.vercel.app',
} = process.env;

// ==========================================
// ڕێکخستنەکانی چاودێری
// ==========================================

const WINDOW_MINUTES = 75;

// ئەگەر یەک IP ئەم ژمارەیە یان زیاتر log دروست بکات
// وەک چالاکیی بەرز نیشان دەدرێت.
const SUSPICIOUS_IP_THRESHOLD = 30;

// ئەگەر لە ماوەی چاودێریدا ئەم ژمارەیە log هەبێت
// وەک بەرزبونەوەی گشتی نیشان دەدرێت.
const HIGH_ACTIVITY_THRESHOLD = 500;

// ئەگەر وەڵامدانەوەی website لەم ماوەیە زیاتر بێت
// ئاگاداریی خاوێتی دروست دەکرێت.
const SLOW_RESPONSE_THRESHOLD_MS = 3000;

// HTTP 5xx = هەڵەی server
const SERVER_ERROR_THRESHOLD = 5;

// ==========================================
// Security Guard
// ==========================================

class SecurityGuard {
  constructor() {
    if (!SUPABASE_URL || !SUPABASE_SERVICE_KEY) {
      throw new Error(
        'SUPABASE_URL or SUPABASE_SERVICE_KEY is missing.'
      );
    }

    this.supabase = createClient(
      SUPABASE_URL,
      SUPABASE_SERVICE_KEY
    );
  }

  // ==========================================
  // خوێندنەوە و شیکردنەوەی Log ـەکان
  // ==========================================

  async analyzeLogs(
    timeWindowMinutes = WINDOW_MINUTES
  ) {
    const since = new Date(
      Date.now() -
        timeWindowMinutes * 60 * 1000
    ).toISOString();

    try {
      const { data, error } =
        await this.supabase
          .from('log')
          .select(`
            id,
            user_id,
            action,
            table_name,
            record_id,
            created_at,
            ip_address,
            description
          `)
          .gte('created_at', since)
          .order('created_at', {
            ascending: false,
          });

      if (error) {
        throw new Error(
          `Supabase log query failed: ${error.message}`
        );
      }

      const logs = data || [];

      // ------------------------------------------
      // IP ـەکان
      // ------------------------------------------

      const ipCounts = new Map();

      for (const log of logs) {
        const ip = log.ip_address;

        if (!ip) continue;

        ipCounts.set(
          ip,
          (ipCounts.get(ip) || 0) + 1
        );
      }

      const suspiciousIps = [
        ...ipCounts.entries(),
      ]
        .filter(
          ([, count]) =>
            count >= SUSPICIOUS_IP_THRESHOLD
        )
        .sort(
          (a, b) => b[1] - a[1]
        )
        .map(([ip, count]) => ({
          ip,
          count,
        }));

      // ------------------------------------------
      // Action ـەکان
      // ------------------------------------------

      const actionCounts = {};

      for (const log of logs) {
        const action =
          log.action || 'نادیار';

        actionCounts[action] =
          (actionCounts[action] || 0) + 1;
      }

      // ------------------------------------------
      // Table ـەکان
      // ------------------------------------------

      const tableCounts = {};

      for (const log of logs) {
        const table =
          log.table_name || 'نادیار';

        tableCounts[table] =
          (tableCounts[table] || 0) + 1;
      }

      // ------------------------------------------
      // نیشانەکانی چالاکیی نائاسایی
      // ------------------------------------------

      const alerts = [];

      if (
        logs.length >=
        HIGH_ACTIVITY_THRESHOLD
      ) {
        alerts.push({
          type: 'HIGH_ACTIVITY',
          severity: 'high',
          message:
            `ژمارەی Log ـەکان زۆر بەرزە: ${logs.length}`,
        });
      }

      for (const item of suspiciousIps) {
        if (
          item.count >=
          SUSPICIOUS_IP_THRESHOLD
        ) {
          alerts.push({
            type: 'HIGH_IP_ACTIVITY',
            severity:
              item.count >= 100
                ? 'high'
                : 'medium',
            ip: item.ip,
            count: item.count,
            message:
              `IP ـێک ${item.count} ڕووداوی تۆمار کردووە.`,
          });
        }
      }

      return {
        success: true,

        totalLogs: logs.length,

        suspiciousIps,

        actionCounts,

        tableCounts,

        alerts,

        logs,

        windowMinutes:
          timeWindowMinutes,
      };
    } catch (error) {
      console.error(
        'Log analysis error:',
        error.message
      );

      return {
        success: false,

        totalLogs: 0,

        suspiciousIps: [],

        actionCounts: {},

        tableCounts: {},

        alerts: [],

        logs: [],

        windowMinutes:
          timeWindowMinutes,

        error: error.message,
      };
    }
  }

  // ==========================================
  // Website Health
  // ==========================================

  async checkWebsiteHealth() {
    try {
      const start = Date.now();

      const response =
        await axios.get(
          WEBSITE_URL,
          {
            timeout: 10000,

            validateStatus:
              () => true,
          }
        );

      const responseTime =
        Date.now() - start;

      const status =
        response.status;

      return {
        healthy:
          status >= 200 &&
          status < 400,

        status,

        responseTime,

        slow:
          responseTime >
          SLOW_RESPONSE_THRESHOLD_MS,

        serverError:
          status >= 500 &&
          status < 600,
      };
    } catch (error) {
      return {
        healthy: false,

        status: null,

        responseTime: null,

        slow: false,

        serverError: false,

        error: error.message,
      };
    }
  }

  // ==========================================
  // Supabase Health
  // ==========================================

  async checkSupabaseHealth() {
    try {
      const { error } =
        await this.supabase
          .from('log')
          .select('id')
          .limit(1);

      if (error) {
        return {
          healthy: false,
          error: error.message,
        };
      }

      return {
        healthy: true,
      };
    } catch (error) {
      return {
        healthy: false,
        error: error.message,
      };
    }
  }

  // ==========================================
  // دروستکردنی Security Alerts
  // ==========================================

  buildSecurityAlerts(
    website,
    supabase,
    logs
  ) {
    const alerts = [];

    // ------------------------------------------
    // Website down
    // ------------------------------------------

    if (!website.healthy) {
      alerts.push({
        severity: 'critical',

        title:
          'ماڵپەڕ بەردەست نییە',

        message:
          website.status
            ? `HTTP ${website.status}`
            : 'وەڵامێک لە ماڵپەڕ وەرنەگیرا.',
      });
    }

    // ------------------------------------------
    // Server error
    // ------------------------------------------

    if (website.serverError) {
      alerts.push({
        severity: 'critical',

        title:
          'هەڵەی Server',

        message:
          `ماڵپەڕ HTTP ${website.status} ـی گەڕاندەوە.`,
      });
    }

    // ------------------------------------------
    // Website slow
    // ------------------------------------------

    if (website.slow) {
      alerts.push({
        severity: 'medium',

        title:
          'ماڵپەڕ خاو بووە',

        message:
          `وەڵامدانەوە ${website.responseTime} ms بوو.`,
      });
    }

    // ------------------------------------------
    // Supabase
    // ------------------------------------------

    if (!supabase.healthy) {
      alerts.push({
        severity: 'critical',

        title:
          'کێشەی Supabase',

        message:
          supabase.error ||
          'Supabase بەردەست نییە.',
      });
    }

    // ------------------------------------------
    // Log alerts
    // ------------------------------------------

    if (logs.success) {
      for (const alert of logs.alerts) {
        alerts.push({
          severity:
            alert.severity,

          title:
            alert.type ===
            'HIGH_ACTIVITY'
              ? 'چالاکیی زۆر'
              : 'چالاکیی زۆری IP',

          message:
            alert.message,

          ip:
            alert.ip || null,

          count:
            alert.count || null,
        });
      }
    }

    return alerts;
  }

  // ==========================================
  // دروستکردنی ڕاپۆرتی ئاسایی
  // ==========================================

  buildReport(
    website,
    supabase,
    logs
  ) {
    const now =
      new Date();

    const baghdadTime =
      new Intl.DateTimeFormat(
        'ku-IQ',
        {
          timeZone:
            'Asia/Baghdad',

          dateStyle:
            'medium',

          timeStyle:
            'medium',
        }
      ).format(now);

    const lines = [];

    lines.push(
      '<b>🛡 ڕاپۆرتی چاودێری KurdMDb</b>'
    );

    lines.push('');

    lines.push(
      `🕒 کات: ${this.escapeHtml(
        baghdadTime
      )}`
    );

    lines.push(
      `⏱ ماوەی چاودێری: ${logs.windowMinutes} خولەک`
    );

    lines.push('');

    // ------------------------------------------
    // Website
    // ------------------------------------------

    lines.push(
      '<b>🌐 دۆخی ماڵپەڕ</b>'
    );

    if (website.healthy) {
      lines.push(
        '🟢 ماڵپەڕ بەردەستە'
      );

      lines.push(
        `• HTTP: ${website.status}`
      );

      if (
        website.responseTime !== null
      ) {
        lines.push(
          `• وەڵامدانەوە: ${website.responseTime} ms`
        );
      }
    } else {
      lines.push(
        '🔴 کێشە لە ماڵپەڕ دۆزرایەوە'
      );

      if (website.status) {
        lines.push(
          `• HTTP: ${website.status}`
        );
      }

      if (website.error) {
        lines.push(
          `• هەڵە: ${this.escapeHtml(
            website.error
          )}`
        );
      }
    }

    lines.push('');

    // ------------------------------------------
    // Supabase
    // ------------------------------------------

    lines.push(
      '<b>🗄 دۆخی Supabase</b>'
    );

    if (supabase.healthy) {
      lines.push(
        '🟢 Supabase بەردەستە'
      );

      lines.push(
        '• خوێندنەوەی Log ـەکان سەرکەوتوو بوو'
      );
    } else {
      lines.push(
        '🔴 کێشە لە Supabase دۆزرایەوە'
      );

      if (supabase.error) {
        lines.push(
          `• هۆکار: ${this.escapeHtml(
            supabase.error
          )}`
        );
      }
    }

    lines.push('');

    // ------------------------------------------
    // Logs
    // ------------------------------------------

    lines.push(
      '<b>📊 دۆخی Log ـەکان</b>'
    );

    if (logs.success) {
      lines.push(
        `• کۆی ڕووداوەکان: ${logs.totalLogs}`
      );

      if (
        logs.totalLogs === 0
      ) {
        lines.push(
          'ℹ️ لەم ماوەیەدا هیچ Log ـێک تۆمار نەکراوە.'
        );
      }
    } else {
      lines.push(
        '🔴 نەکرا Log ـەکان بخوێندرێنەوە.'
      );

      if (logs.error) {
        lines.push(
          `• هۆکار: ${this.escapeHtml(
            logs.error
          )}`
        );
      }
    }

    lines.push('');

    // ------------------------------------------
    // Actions
    // ------------------------------------------

    const actions =
      Object.entries(
        logs.actionCounts
      );

    if (actions.length > 0) {
      lines.push(
        '<b>📌 کردارەکان</b>'
      );

      for (
        const [action, count]
        of actions.slice(0, 10)
      ) {
        lines.push(
          `• ${this.escapeHtml(
            action
          )}: ${count} جار`
        );
      }

      lines.push('');
    }

    // ------------------------------------------
    // IP
    // ------------------------------------------

    lines.push(
      '<b>🔎 چاودێری IP</b>'
    );

    if (
      logs.suspiciousIps.length >
      0
    ) {
      lines.push(
        `⚠️ ${logs.suspiciousIps.length} IP ـی زۆر چالاک دۆزرایەوە`
      );

      for (
        const item
        of logs.suspiciousIps
          .slice(0, 10)
      ) {
        lines.push(
          `• <code>${this.escapeHtml(
            item.ip
          )}</code> — ${item.count} ڕووداو`
        );
      }

      lines.push('');

      lines.push(
        'ℹ️ هیچ IP ـێک خۆکارانە block نەکراوە.'
      );
    } else {
      lines.push(
        '🟢 هیچ IP ـێک سنووری چاودێری تێنەپەڕاندووە.'
      );
    }

    lines.push('');

    // ------------------------------------------
    // دۆخی گشتی
    // ------------------------------------------

    const overallHealthy =
      website.healthy &&
      supabase.healthy &&
      logs.success;

    if (overallHealthy) {
      lines.push(
        '<b>🟢 دۆخی گشتی</b>'
      );

      lines.push(
        'هەموو پشکنینە سەرەکییەکان بە سەرکەوتوویی تێپەڕین.'
      );
    } else {
      lines.push(
        '<b>🟠 دۆخی گشتی</b>'
      );

      lines.push(
        'یەکێک لە پشکنینەکان کێشەی هەیە.'
      );
    }

    lines.push('');

    lines.push(
      '📋 سیستەمەکە تەنها چاودێری دەکات و هیچ IP ـێک خۆکارانە block ناکات.'
    );

    return lines.join('\n');
  }

  // ==========================================
  // دروستکردنی پەیامی 🚨 ئاگاداری
  // ==========================================

  buildAlertReport(
    alerts
  ) {
    const now =
      new Date();

    const baghdadTime =
      new Intl.DateTimeFormat(
        'ku-IQ',
        {
          timeZone:
            'Asia/Baghdad',

          dateStyle:
            'medium',

          timeStyle:
            'medium',
        }
      ).format(now);

    const critical =
      alerts.filter(
        (a) =>
          a.severity ===
          'critical'
      );

    const high =
      alerts.filter(
        (a) =>
          a.severity ===
          'high'
      );

    const medium =
      alerts.filter(
        (a) =>
          a.severity ===
          'medium'
      );

    const lines = [];

    lines.push(
      '<b>🚨 ئاگادارییەکی سەلامەتی KurdMDb</b>'
    );

    lines.push('');

    lines.push(
      `🕒 کات: ${this.escapeHtml(
        baghdadTime
      )}`
    );

    lines.push('');

    if (critical.length > 0) {
      lines.push(
        '<b>🔴 کێشەی گرنگ</b>'
      );

      for (
        const alert
        of critical
      ) {
        lines.push(
          `• ${this.escapeHtml(
            alert.title
          )}`
        );

        lines.push(
          `  ${this.escapeHtml(
            alert.message
          )}`
        );
      }

      lines.push('');
    }

    if (high.length > 0) {
      lines.push(
        '<b>🚨 چالاکیی بەرز</b>'
      );

      for (
        const alert
        of high
      ) {
        lines.push(
          `• ${this.escapeHtml(
            alert.title
          )}`
        );

        lines.push(
          `  ${this.escapeHtml(
            alert.message
          )}`
        );

        if (alert.ip) {
          lines.push(
            `  IP: <code>${this.escapeHtml(
              alert.ip
            )}</code>`
          );
        }
      }

      lines.push('');
    }

    if (medium.length > 0) {
      lines.push(
        '<b>🟠 ئاگاداری</b>'
      );

      for (
        const alert
        of medium
      ) {
        lines.push(
          `• ${this.escapeHtml(
            alert.title
          )}: ${this.escapeHtml(
            alert.message
          )}`
        );
      }

      lines.push('');
    }

    lines.push(
      '⚠️ ئەم ئاگادارییە نیشانەی چالاکیی نائاساییە؛ بە تەنیا پشتڕاست ناکاتەوە کە DDoS ڕووی داوە.'
    );

    lines.push('');

    lines.push(
      '🛡 کردار: تەنها ئاگادارکردنەوە — هیچ IP ـێک خۆکارانە block نەکراوە.'
    );

    return lines.join('\n');
  }

  // ==========================================
  // HTML escaping
  // ==========================================

  escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      );
  }

  // ==========================================
  // ناردنی Telegram
  // ==========================================

  async sendMessage(
    message
  ) {
    if (
      !SECURITY_TELEGRAM_BOT_TOKEN ||
      !TELEGRAM_CHAT_ID
    ) {
      throw new Error(
        'Telegram environment variables are missing.'
      );
    }

    const url =
      `https://api.telegram.org/bot${SECURITY_TELEGRAM_BOT_TOKEN}/sendMessage`;

    try {
      await axios.post(
        url,
        {
          chat_id:
            TELEGRAM_CHAT_ID,

          text:
            message,

          parse_mode:
            'HTML',

          disable_web_page_preview:
            true,
        },
        {
          timeout: 10000,
        }
      );
    } catch (error) {
      console.error(
        'Telegram send error:',
        error.response?.data ||
          error.message
      );

      throw error;
    }
  }

  // ==========================================
  // ڕاپۆرتی ئاسایی
  // ==========================================

  async runScheduledReport() {
    const [
      website,
      supabase,
      logs,
    ] = await Promise.all([
      this.checkWebsiteHealth(),

      this.checkSupabaseHealth(),

      this.analyzeLogs(
        WINDOW_MINUTES
      ),
    ]);

    const alerts =
      this.buildSecurityAlerts(
        website,
        supabase,
        logs
      );

    // ئەگەر ئاگاداریی گرنگ هەبێت،
    // پەیامی ئاگاداری دەنێرین.
    if (alerts.length > 0) {
      const alertReport =
        this.buildAlertReport(
          alerts
        );

      await this.sendMessage(
        alertReport
      );

      return;
    }

    // ئەگەر هیچ ئاگادارییەک نەبوو،
    // ڕاپۆرتی ئاسایی دەنێرین.
    const report =
      this.buildReport(
        website,
        supabase,
        logs
      );

    await this.sendMessage(
      report
    );
  }

  // ==========================================
  // Instant Alert
  // ==========================================

  async runInstantAlert() {
    const [
      website,
      supabase,
      logs,
    ] = await Promise.all([
      this.checkWebsiteHealth(),

      this.checkSupabaseHealth(),

      this.analyzeLogs(
        WINDOW_MINUTES
      ),
    ]);

    const alerts =
      this.buildSecurityAlerts(
        website,
        supabase,
        logs
      );

    if (alerts.length > 0) {
      await this.sendMessage(
        this.buildAlertReport(
          alerts
        )
      );

      return;
    }

    await this.sendMessage(
      this.buildReport(
        website,
        supabase,
        logs
      )
    );
  }
}

export default SecurityGuard;
